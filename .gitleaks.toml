[extend]
useDefault = true

[allowlist]
description = "Q-Crypto known safe test vectors, lockfile hashes, and type constants"

paths = [
  '''vectors/.*''',
  '''Cargo\.lock$''',
]

stopwords = [
  "SECRET_KEY_BYTES",
  "SHARED_SECRET_BYTES",
  "SecretKey",
  "SecretPolys",
  "sk_prf",
  "sk_seed",
]
