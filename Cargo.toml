[package]
name = "qtv-crypto"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The single post-quantum cryptography crate for the Quantova stack: ML-KEM, ML-DSA, SLH-DSA, FN-DSA, SHA-3/SHAKE, a from-scratch reference implementation of the FIPS specifications validated against NIST test vectors. Not independently audited."
repository = "https://github.com/Quantova/Q-Crypto"
rust-version = "1.75"

[features]
default = ["os-rng"]
# Safe-default helpers that draw randomness from the operating-system CSPRNG
# (keygen_os, sign_os, encaps_os). Zero dependency: entropy is read from
# /dev/urandom, so a std target is required. Turn it off to keep only the
# explicit caller-supplied randomness entry points.
os-rng = []
# FN-DSA is feature-flagged and OFF by default until final publication (POLICY-crypto.md section 2).
fn-dsa = []

[dependencies]

[dev-dependencies]

[[bench]]
name = "throughput"
path = "benches/throughput.rs"
harness = false
