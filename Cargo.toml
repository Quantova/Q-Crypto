[package]
name = "qtv-crypto"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The single post-quantum cryptography crate for the Quantova stack: ML-KEM-768 and ML-KEM-1024, ML-DSA-65 and ML-DSA-87, SLH-DSA, SHA-3/SHAKE, SHA-384/SHA-512, a from-scratch reference implementation of the FIPS specifications validated against NIST test vectors. Not independently audited."
repository = "https://github.com/Quantova/Q-Crypto"
rust-version = "1.75"

[features]
default = ["os-rng"]
os-rng = []
acvp-internals = []

[dependencies]

[dev-dependencies]

[[bench]]
name = "throughput"
path = "benches/throughput.rs"
harness = false

[profile.release]
overflow-checks = true
